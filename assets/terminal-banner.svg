<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Hyperrbeast — Aadesh Srivastava</title>
  <desc id="desc">A dark developer terminal with neon green lettering, a geometric circuit motif, and a blinking cursor.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#153023" stroke-width="1"/></pattern>
    <linearGradient id="fade" x2="1" y2="1"><stop stop-color="#12251a"/><stop offset="1" stop-color="#070d0a"/></linearGradient>
  </defs>
  <rect width="1200" height="480" rx="20" fill="#070d0a"/>
  <rect x="1" y="1" width="1198" height="478" rx="19" fill="url(#grid)" stroke="#284337" stroke-width="2"/>
  <path d="M1 58H1199" stroke="#284337" stroke-width="2"/>
  <g fill="#8da197"><circle cx="30" cy="29" r="6"/><circle cx="52" cy="29" r="6"/></g>
  <circle cx="74" cy="29" r="6" fill="#a3ff6b"/>
  <text x="106" y="35" fill="#9bae9f" font-family="Consolas, monospace" font-size="15">hyperrbeast / personal-space</text>
  <text x="1148" y="35" text-anchor="end" fill="#a3ff6b" font-family="Consolas, monospace" font-size="14">~/</text>
  <g font-family="Consolas, monospace">
    <text x="60" y="125" font-size="18" fill="#a3ff6b">$ ./introduce</text>
    <text x="55" y="218" font-size="82" font-weight="700" letter-spacing="-3" fill="#a3ff6b">HYPERRBEAST</text>
    <text x="60" y="267" font-size="23" letter-spacing="4" fill="#edf6ed">AADESH SRIVASTAVA</text>
    <text x="60" y="324" font-size="19" fill="#9bae9f">Curiosity first. Code follows.</text>
    <path d="M60 360H716" stroke="#284337"/>
    <text x="60" y="411" font-size="16" fill="#a3ff6b">&gt; less noise. more building.</text>
    <rect x="363" y="395" width="11" height="20" fill="#a3ff6b">
      <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="none" stroke="#a3ff6b">
    <path d="M971 108L1103 184V336L971 412L839 336V184Z" stroke-opacity=".18" stroke-width="2"/>
    <path d="M971 142L1073 201V319L971 378L869 319V201Z" fill="url(#fade)" stroke-opacity=".45" stroke-width="2"/>
    <path d="M932 219L897 260L932 301M1010 219L1045 260L1010 301M990 207L952 313" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M839 260H794M1103 260H1148M971 108V85M971 412V435" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="794" cy="260" r="4" fill="#a3ff6b"/><circle cx="1148" cy="260" r="4" fill="#a3ff6b"/>
  </g>
</svg>
