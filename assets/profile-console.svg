<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Hyperrbeast — Aadesh Srivastava</title>
<desc id="desc">Personal developer console. Aadesh Srivastava, Hyperrbeast, India. Curiosity first. Code follows. Make something useful. Keep making it better. Stack: TypeScript, React, Next.js, Tailwind CSS, Node.js, Express, MongoDB, Git.</desc>
